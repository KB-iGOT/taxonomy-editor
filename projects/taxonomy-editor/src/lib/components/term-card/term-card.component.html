<ng-container [ngSwitch]="((data && data?.cardSubType) || 'cardMinimal')">
    <ng-container *ngSwitchCase="'standard'" [ngTemplateOutlet]="cardStandard"></ng-container>
    <ng-container *ngSwitchCase="'space-saving'" [ngTemplateOutlet]="cardSpaceSaving"></ng-container>
    <ng-container *ngSwitchDefault [ngTemplateOutlet]="cardMinimal"></ng-container>
</ng-container>

<ng-template #cardMinimal>
    <div #cardRef class="term-card clickable" [ngClass]="[
  'index-' + data?.index,
  data?.children?.selected ? 'selected' : '',
  data?.children?.approvalStatus === 'Draft' ? 'inDraft' : '',
  ((data?.children?.associationProperties?.approvalStatus === 'Draft' && isApprovalRequired && !approvalList.length) ||
   (data?.children?.highlight && isApprovalRequired)) ? 'inAssociationDraft' : ''
]" (click)="cardClicked(data, cardRef)" [id]="data?.children?.name" [ngStyle]="{
            'background-color': getColor(data.index, cardRef, 'bgColor', data),
            'border-left': getColor(data.index, cardRef, 'border', data)
        }">
        <!-- (click)="data.selected=!data.selected" -->

        <div class="term-card-parent">
            <!-- <Below element is to show id on top left of the card> -->
            <!-- <div class="id" [hidden]="true">{{data.children.code}}</div> -->

            <div class="term-card-content">
                <!-- <ng-container  *ngIf="data?.children?.refId">
                    <div class="ribbon">{{data?.children?.refId}}</div>
                </ng-container> -->

                <ng-container *ngIf="data?.children?.additionalProperties?.competencyArea?.name">
                    <div class="mb-2">
                        <span
                            class="comp-area {{data?.children?.additionalProperties?.competencyArea?.name?.toLowerCase()}}">
                            {{ data?.children?.additionalProperties?.competencyArea?.name }}
                        </span>
                    </div>
                </ng-container>

                <div class="card-header-row">
                    <div class="card-title">
                        {{data?.children?.name}}

                        <ng-container *ngIf="data?.children?.refId">
                            <div class="refIdCard mt-2">
                                <span>{{data?.children?.refId}}</span>
                            </div>
                        </ng-container>
                    </div>

                    <!-- <ng-container *ngIf="data?.children?.refId">
                        <div class="refIdCard px-4">
                            <span>{{data?.children?.refId}}</span>
                        </div>
                    </ng-container> -->

                    <!-- <span>++{{data.children.selected}}+++</span>
                    <span>=={{data.children.status}}==</span> -->

                    <ng-container *ngIf="data.columnInfo.config.enableThreeDot">
                        <button type="button" mat-icon-button aria-label="action items" class="action-btn"
                            (click)="onThreeDotsClick($event, cardRef)">
                            <mat-icon>more_vert</mat-icon>
                        </button>
                    </ng-container>
                </div>

                <div class="card-description">
                    {{ data.children.description }}
                </div>
            </div>
        </div>

        <!-- Toggle panel: only open when this card id matches global activeMenuCardId -->
        <div class="custom-menu" *ngIf="activeMenuCardId === data.children.identifier"
            (click)="$event.stopPropagation()">
            <button class="custom-menu-item" *ngIf="data.columnInfo.config.enableAdd" (click)="create(data)">
                <mat-icon class="custom-menu-icon">add</mat-icon>
                <span>Add</span>
            </button>

            <button class="custom-menu-item" *ngIf="data.columnInfo.config.enableView"
                (click)="view(data, data.children, data.index)">
                <mat-icon class="custom-menu-icon">visibility</mat-icon>
                <span>View</span>
            </button>

            <button class="custom-menu-item" *ngIf="data.columnInfo.config.enabaleEdit"
                (click)="edit(data, data.children, data.index, cardRef)">
                <mat-icon class="custom-menu-icon">edit</mat-icon>
                <span>Edit</span>
            </button>

            <button class="custom-menu-item" *ngIf="data.columnInfo.config.enableDelete" (click)="delete(data)">
                <mat-icon class="custom-menu-icon">delete</mat-icon>
                <span>Delete</span>
            </button>
        </div>

        <!--
        <div class="term-card-checkbox">
            <mat-checkbox
                color="primary"
                *ngIf="data.children.approvalStatus === 'Draft' && isApprovalRequired && !approvalList.length ||
                       data.children.associationProperties?.approvalStatus === 'Draft' && isApprovalRequired && !approvalList.length ||
                       data.children.highlight && isApprovalRequired"
                [checked]="data.children.highlight"
                class="termSelection"
                (change)="handleProductClick(data.children, $event)"
                (click)="$event.stopPropagation()">
            </mat-checkbox>

            <mat-icon
                color="primary"
                class="approve-flag"
                *ngIf="data.children.highlight && isApprovalRequired">
                {{app_strings.flag}}
            </mat-icon>
        </div>
        -->
    </div>
</ng-template>

<ng-template #cardStandard>
    <div>{{ data.children.name }}</div>
    <div>{{ data.children.description }}</div>
</ng-template>

<ng-template #cardSpaceSaving>
    <div>{{ data.children.name }}</div>
</ng-template>
